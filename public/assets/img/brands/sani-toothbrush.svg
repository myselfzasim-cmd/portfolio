<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <linearGradient id="saniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="236" height="76" rx="14" fill="#081520" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Toothbrush / Sparkle Icon -->
  <g transform="translate(14, 16)">
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#saniGrad)"/>
    <!-- Toothbrush bristle silhouette -->
