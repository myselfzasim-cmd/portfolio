  </g>

  <!-- Typography -->
  <text x="68" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">SANI</text>
  <text x="69" y="55" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#22d3ee" letter-spacing="2">TOOTHBRUSH · ORAL CARE</text>
  
  <!-- Sparkle Badge -->
