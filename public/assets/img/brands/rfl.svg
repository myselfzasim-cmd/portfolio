<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <linearGradient id="rflBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="236" height="76" rx="14" fill="#080e1e" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Classic RFL Box Emblem -->
  <g transform="translate(14, 16)">
    <rect x="2" y="2" width="44" height="44" rx="8" fill="url(#rflBlue)"/>
    <!-- Red stripe in the middle of RFL -->
    <rect x="4" y="34" width="40" height="8" rx="2" fill="#ef4444"/>
    <text x="24" y="27" font-family="'Arial Black', Impact, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">RFL</text>
  </g>

  <!-- Typography -->
  <text x="68" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">RFL GROUP</text>
  <text x="69" y="55" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#60a5fa" letter-spacing="2">PLASTICS, HOUSEWARE &amp; FMCG</text>
</svg>